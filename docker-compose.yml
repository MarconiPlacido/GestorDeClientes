version: "3.9"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "SenhaForte@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
      - mongodb
      - rabbitmq
      - minio
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: "jZg86CTJOpYDij1pxn1XaVnZqyR+5/gxlmACGOqkq9bbsIRDGmJOy6Jjpc8PJpRQV99Tiin+rhODGM5N3Qrfsg=="
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DbGestorDeClientes;User Id=sa;Password=SenhaForte@123;TrustServerCertificate=True"
